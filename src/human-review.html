<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOUCHLINE · 선수 체형 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111816;color:#e8ece4;font:15px Arial,sans-serif}header{padding:28px 4vw 12px;display:flex;justify-content:space-between;align-items:end}h1{font-size:28px;margin:8px 0}.eyebrow{font-size:11px;color:#aac978;letter-spacing:3px}p{color:#a4b1a9;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 4vw}button,select,a{background:#26352d;border:1px solid #46584c;color:#eef2e5;padding:9px 16px;border-radius:5px;cursor:pointer;text-decoration:none}button:hover{background:#426046}canvas{display:block;width:100%;height:61vh;min-height:360px}.labels{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:0 4vw}.labels b{font-size:23px}.labels p{margin-top:6px}footer{padding:16px 4vw;color:#9fae9f}output{white-space:pre-wrap;font-size:12px}#error{color:#fbb}</style>

<header><div><span class="eyebrow">TOUCHLINE / PLAYER LAB</span><h1>하나의 선수, 네 가지 체형.</h1><p>게임에서 사용하는 실제 3D 모델입니다. 고유 체형은 부위별 비율을 직접 정할 수 있습니다.</p></div><a href="../">게임으로</a></header>
